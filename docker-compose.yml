services:
  postgres-gestao:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestao_development
    volumes:
      - postgres_gestao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-routing:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: routing_development
    volumes:
      - postgres_routing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  management-service:
    build: ./management-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-gestao:5432/gestao_development
      RAILS_ENV: development
      SECRET_KEY_BASE: development_secret_key_base_not_used_in_production
    depends_on:
      postgres-gestao:
        condition: service_healthy

  routing-service:
    build: ./routing-service
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-routing:5432/routing_development
      MANAGEMENT_SERVICE_URL: http://management-service:3001
      PORT: "4000"
    restart: on-failure
    depends_on:
      postgres-routing:
        condition: service_healthy
      management-service:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - management-service
      - routing-service

volumes:
  postgres_gestao_data:
  postgres_routing_data:
